# LLNet unified Docker Compose. All services remain under the same project.
# This file replaces docker-compose.yml + compose.stage5c.yml + compose.stage5d.yml.
# Do not change project name or volume names when migrating existing deployments.
name: sdn-mininet-ryu

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/airflow
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'False'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: llnet:admin
  AIRFLOW__API__BASE_URL: http://localhost:8081
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/shared/users.json
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
  LLNET_INTERNAL_TOKEN: ${LLNET_INTERNAL_TOKEN:?Set LLNET_INTERNAL_TOKEN in .env}
  LLNET_POLICY_API_URL: http://policy-api:8000

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags:ro
  - airflow_logs:/opt/airflow/logs
  - airflow_auth:/opt/airflow/shared

x-policy-build: &policy-build
  context: .
  dockerfile: infra/docker/policy-api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llnet}
      POSTGRES_USER: ${POSTGRES_USER:-llnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [sdn-net]

  ryu-controller:
    build:
      context: .
      dockerfile: infra/docker/ryu/Dockerfile
    container_name: ryu-controller
    ports:
      - "127.0.0.1:6653:6653"
    networks:
      sdn-net:
        ipv4_address: 172.20.0.10

  mininet-net:
    build:
      context: .
      dockerfile: infra/docker/mininet/Dockerfile
    container_name: mininet-net
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./:/app
    command: tail -f /dev/null
    depends_on: [ryu-controller]
    networks:
      sdn-net:
        ipv4_address: 172.20.0.20

  policy-api:
    build: *policy-build
    container_name: llnet-policy-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llnet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llnet}
      RYU_URL: http://ryu-controller:8080
      LLNET_INTERNAL_TOKEN: ${LLNET_INTERNAL_TOKEN:?Set LLNET_INTERNAL_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ryu-controller:
        condition: service_started
    networks: [sdn-net]

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set required secret in .env}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sdn-net]

  airflow-auth-init:
    image: python:3.11-alpine
    user: '0:0'
    environment:
      AIRFLOW_LAB_PASSWORD: ${AIRFLOW_LAB_PASSWORD:?Set required secret in .env}
    volumes:
      - airflow_auth:/shared
    command:
      - python
      - -c
      - |
        import json, os
        path='/shared/users.json'
        with open(path, 'w', encoding='utf-8') as fh:
            json.dump({'llnet': os.environ['AIRFLOW_LAB_PASSWORD']}, fh)
        os.chown(path, 50000, 0)
        os.chmod(path, 0o600)
    networks: [sdn-net]

  airflow-init:
    image: apache/airflow:3.2.2
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-auth-init:
        condition: service_completed_successfully
    networks: [sdn-net]

  airflow-api-server:
    image: apache/airflow:3.2.2
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["airflow", "api-server"]
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [sdn-net]

  airflow-dag-processor:
    image: apache/airflow:3.2.2
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started
    networks: [sdn-net]

  airflow-scheduler:
    image: apache/airflow:3.2.2
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started
      airflow-dag-processor:
        condition: service_started
    networks: [sdn-net]

  policy-dispatcher:
    build: *policy-build
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llnet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-llnet}
      AIRFLOW_API_URL: http://airflow-api-server:8080
      AIRFLOW_USERNAME: llnet
      AIRFLOW_LAB_PASSWORD: ${AIRFLOW_LAB_PASSWORD:?Set required secret in .env}
    command: ["python", "-m", "app.cli.dispatch_outbox", "--interval", "5"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_started
    networks: [sdn-net]

  policy-reconciler:
    build: *policy-build
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llnet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-llnet}
      RYU_URL: http://ryu-controller:8080
      LLNET_AUTO_HEAL: ${LLNET_AUTO_HEAL:-false}
    command: ["python", "-m", "app.cli.observe_flows", "--interval", "15"]
    depends_on:
      postgres:
        condition: service_healthy
      ryu-controller:
        condition: service_started
    networks: [sdn-net]

  intent-retriever:
    build:
      context: .
      dockerfile: infra/docker/retriever/Dockerfile
    environment:
      HF_HOME: /var/cache/llnet/huggingface
      LLNET_BGE_MODEL: BAAI/bge-small-en-v1.5
      LLNET_RETRIEVAL_INDEX: /var/cache/llnet/index/firewall-v1.json
    volumes:
      - llnet_bge_models:/var/cache/llnet/huggingface
      - llnet_retrieval_index:/var/cache/llnet/index
    ports:
      - "127.0.0.1:8092:8092"
    restart: unless-stopped
    networks: [sdn-net]

  phi-inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/phi-3.5-mini-instruct-q4_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - '8093'
      - --ctx-size
      - '8192'
      - --n-predict
      - '512'
      - --threads
      - '4'
    volumes:
      - ./models/llnet-phi:/models:ro
    ports:
      - '127.0.0.1:8093:8093'
    restart: unless-stopped
    networks: [sdn-net]

  intent-orchestrator:
    build:
      context: .
      dockerfile: infra/docker/intent-api/Dockerfile
    environment:
      LLNET_RETRIEVER_URL: http://intent-retriever:8092
      LLNET_PHI_URL: http://phi-inference:8093
      LLNET_PHI_TIMEOUT_SECONDS: '180'
      LLNET_DRY_RUN_CONTEXT_MODE: fixture
    ports:
      - '127.0.0.1:8094:8094'
    restart: unless-stopped
    networks: [sdn-net]

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
  airflow_auth:
  llnet_bge_models:
  llnet_retrieval_index:

networks:
  sdn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
